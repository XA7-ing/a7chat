<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>A7chat</title>
<style>
:root{
  --bg:#f4f7f5; --card:#ffffff; --line:#e6ece7; --text:#22302a; --dim:#8b9a91;
  --green:#3d8f50; --on:#ddf0e1; --mine:#d7efdb;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);
  font:15px/1.55 -apple-system,"Noto Sans CJK SC","PingFang SC",Roboto,sans-serif;
  overscroll-behavior:none}
.screen{position:fixed;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
button{font:inherit;color:inherit;background:none;border:0;padding:0}
input,textarea{font:inherit}

#login{padding:28px 22px;justify-content:center;gap:14px;
  background:linear-gradient(180deg,#eaf5ec,#f7faf8 42%,#f7faf8)}
#login .brand{text-align:center;margin-bottom:10px}
#login .brand .dot{width:64px;height:64px;margin:0 auto 12px;border-radius:50%;
  background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
  font-size:30px;box-shadow:0 6px 18px rgba(61,143,80,.10)}
#login h1{font-size:19px;margin:0 0 4px;font-weight:600}
#login .sub{color:var(--dim);font-size:12.5px;margin:0}
.field{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 14px}
.field label{display:block;font-size:11.5px;color:var(--dim);margin-bottom:3px}
.field input{width:100%;border:0;outline:0;background:none;font-size:15px;color:var(--text)}
.btn-main{background:var(--green);color:#fff;border-radius:14px;padding:13px;text-align:center;
  font-weight:600;letter-spacing:.5px;box-shadow:0 8px 18px rgba(61,143,80,.22)}
.btn-main:active{transform:scale(.985)}
.hint{color:#c0563f;font-size:12.5px;min-height:18px;text-align:center}
.tip{color:var(--dim);font-size:11.5px;text-align:center;line-height:1.7}
.ver{color:#b9c7bf;font-size:10.5px;text-align:center}

.topbar{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:12px 14px;
  background:rgba(255,255,255,.92);border-bottom:1px solid var(--line)}
.topbar .t{flex:1;min-width:0}
.topbar h2{margin:0;font-size:15.5px;font-weight:600;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.topbar .s{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  color:var(--dim);font-size:19px}
.icon:active{background:var(--on)}

#listBody{flex:1;overflow:auto;padding:10px 12px 84px}
.srow{display:flex;gap:11px;align-items:center;background:var(--card);border:1px solid var(--line);
  border-radius:15px;padding:12px;margin-bottom:9px}
.srow:active{background:#fbfdfb}
.sava{width:40px;height:40px;border-radius:12px;background:var(--on);color:var(--green);
  display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 auto}
.srow .nm{flex:1;min-width:0}
.srow .nm b{display:block;font-weight:500;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .nm span{font-size:11.5px;color:var(--dim)}
.fab{position:fixed;right:18px;bottom:26px;width:52px;height:52px;border-radius:50%;
  background:var(--green);color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 22px rgba(61,143,80,.3)}
.fab:active{transform:scale(.94)}
.empty{color:var(--dim);text-align:center;font-size:13px;padding:60px 20px;line-height:1.9}
.dotlive{width:7px;height:7px;border-radius:50%;background:#7cc98a;display:inline-block;margin-right:5px}

#msgs{flex:1;overflow:auto;padding:14px 12px 6px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;align-items:flex-start}
.row.me{flex-direction:row-reverse}
.av{width:30px;height:30px;border-radius:9px;flex:0 0 auto;background:var(--on);color:var(--green);
  display:flex;align-items:center;justify-content:center;font-size:13px}
.row.me .av{background:#e7f1e9;color:#5c7d64}
.bub{max-width:76%;background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:9px 12px;white-space:pre-wrap;word-break:break-word;font-size:14.5px}
.row.me .bub{background:var(--mine);border-color:#cfe7d4}
.bub.think{color:var(--dim)}
.bub img{max-width:100%;border-radius:10px;display:block;margin:4px 0}
.composer{flex:0 0 auto;display:flex;gap:8px;align-items:flex-end;padding:9px 10px calc(9px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.94);border-top:1px solid var(--line)}
.composer textarea{flex:1;min-height:38px;max-height:120px;resize:none;border:1px solid var(--line);
  border-radius:12px;padding:9px 11px;outline:0;background:var(--card);font-size:14.5px}
.send{background:var(--green);color:#fff;border-radius:12px;padding:10px 16px;font-size:14px;font-weight:500}
.plus{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);
  color:var(--green);font-size:20px;display:flex;align-items:center;justify-content:center}
.chips{display:none;gap:8px;padding:8px 10px 0;background:rgba(255,255,255,.94);overflow:auto}
.chips.on{display:flex}
.chip{display:flex;align-items:center;gap:6px;background:#eef5f0;border:1px solid #d6e7da;
  border-radius:10px;padding:5px 9px;font-size:12px;color:#4c6b55;white-space:nowrap}
.chip .x{color:#b3c3b8;font-size:14px;line-height:1}
.send:disabled{opacity:.45}
</style>
</head>
<body>

<section class="screen on" id="login">
  <div class="brand">
    <div class="dot">🐾</div>
    <h1>A7chat</h1>
    <p class="sub">连接你自己部署的 AstrBot</p>
  </div>
  <div class="field"><label>服务器地址</label>
    <input id="fBase" placeholder="http://192.168.1.100:6185" autocapitalize="off" autocorrect="off" spellcheck="false">
  </div>
  <div class="field"><label>AstrBot 用户名</label>
    <input id="fUser" placeholder="用户名" autocapitalize="off" spellcheck="false">
  </div>
  <div class="field"><label>密码</label>
    <input id="fPass" type="password" placeholder="WebUI 登录密码">
  </div>
  <div class="hint" id="loginHint"></div>
  <button class="btn-main" id="btnLogin">登录</button>
  <p class="tip">填 AstrBot WebUI 的地址，同 WiFi 一般形如<br>http://电脑IP:6185</p>
  <p class="ver" id="ver"></p>
</section>

<section class="screen" id="home">
  <div class="topbar">
    <div class="t"><h2 id="homeTitle">会话</h2><div class="s" id="homeSub">未连接</div></div>
    <button class="icon" id="btnOut">⎋</button>
  </div>
  <div id="listBody"><div class="empty">正在加载会话…</div></div>
  <button class="fab" id="btnNew">＋</button>
</section>

<section class="screen" id="chat">
  <div class="topbar">
    <button class="icon" id="btnBack">‹</button>
    <div class="t"><h2 id="chatTitle">会话</h2>
      <div class="s" id="chatSub"><span class="dotlive"></span>已连接</div></div>
  </div>
  <div id="msgs"></div>
  <div class="chips" id="chips"></div>
  <div class="composer">
    <button class="plus" id="btnPlus">＋</button>
    <input type="file" id="fileSel" accept="image/*" style="display:none">
    <textarea id="input" rows="1" placeholder="点这里说话…"></textarea>
    <button class="send" id="btnSend">发送</button>
  </div>
</section>

<script>
const VER = 'v1.0';
const $ = s => document.querySelector(s);
const ORIGIN = location.origin;
let cfg = { base:'', token:'', user:'' };

/* ---------- 存储 ---------- */
function saveCfg(){
  localStorage.setItem('xgc_cfg', JSON.stringify(cfg));
}
function loadCfg(){
  try{
    const j = JSON.parse(localStorage.getItem('xgc_cfg') || '{}');
    cfg = { base: j.base || '', token: j.token || '', user: j.user || '' };
  }catch(e){ cfg = { base:'', token:'', user:'' }; }
  return !!(cfg.base && cfg.token);
}
function clearCfg(){ cfg = { base:'', token:'', user:'' }; localStorage.removeItem('xgc_cfg'); }

/* ---------- 请求（全部经本机转发） ---------- */
function px(url){ return ORIGIN + '/p?u=' + encodeURIComponent(url); }
function hdrs(extra){
  const h = Object.assign({}, extra || {});
  if (cfg.token) h['Authorization'] = 'Bearer ' + cfg.token;
  return h;
}
async function api(path, opt = {}){
  const r = await fetch(px(cfg.base + path), {
    method: opt.method || 'GET',
    headers: hdrs(opt.headers),
    body: opt.body ? JSON.stringify(opt.body) : undefined
  });
  const txt = await r.text();
  let j = {};
  try{ j = JSON.parse(txt || '{}'); }catch(e){ throw new Error('服务器返回的不是 JSON：' + txt.slice(0, 80)); }
  if (j.status && j.status !== 'ok') throw new Error(j.message || ('状态 ' + j.status));
  if (r.status >= 400 && !j.status) throw new Error(j.detail || j.message || ('HTTP ' + r.status));
  return j;
}
function normBase(b){
  b = (b || '').trim();
  if (!b) return '';
  if (!/^https?:\/\//i.test(b)) b = 'http://' + b;
  return b.replace(/\/+$/, '');
}

/* ---------- 登录 ---------- */
$('#btnLogin').onclick = async () => {
  const base = normBase($('#fBase').value);
  const user = $('#fUser').value.trim();
  const pass = $('#fPass').value;
  const hint = $('#loginHint');
  if (!base || !user || !pass){ hint.textContent = '三项都要填哦'; return; }
  hint.textContent = '正在登录…'; $('#btnLogin').disabled = true;
  try{
    const r = await fetch(px(base + '/api/v1/auth/login'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: user, password: pass })
    });
    const txt = await r.text();
    let j = {};
    try{ j = JSON.parse(txt || '{}'); }catch(e){ throw new Error('地址对不上？返回的是网页而不是接口'); }
    const d = j.data || {};
    const tok = d.token || d.access_token || j.token || '';
    if (!tok) throw new Error(j.message || j.detail || ('HTTP ' + r.status));
    cfg.base = base; cfg.token = tok; cfg.user = user;
    saveCfg();
    await fetch(ORIGIN + '/__token', { method:'POST', body: tok });
    $('#fPass').value = '';
    hint.textContent = '';
    await bootHome();
  }catch(e){
    hint.textContent = '登录失败：' + (e.message || e);
  }finally{
    $('#btnLogin').disabled = false;
  }
};

/* ---------- 页面切换 ---------- */
function show(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
  $('#' + id).classList.add('on');
}

/* ---------- 会话列表 ---------- */
async function bootHome(){
  show('home');
  $('#homeSub').textContent = cfg.user + ' @ ' + cfg.base.replace(/^https?:\/\//, '');
  await loadSessions();
}
async function loadSessions(){
  const box = $('#listBody');
  box.innerHTML = '<div class="empty">正在加载会话…</div>';
  try{
    const j = await api('/api/chat/sessions');
    const all = j.data || [];
    const list = all.filter(s => !s.creator || s.creator === cfg.user);
    if (!list.length){
      box.innerHTML = '<div class="empty">还没有会话<br>点右下角 ＋ 开一个</div>';
      return;
    }
    box.innerHTML = '';
    list.forEach(s => {
      const row = document.createElement('div'); row.className = 'srow';
      const av = document.createElement('div'); av.className = 'sava'; av.textContent = '💬';
      const nm = document.createElement('div'); nm.className = 'nm';
      const b = document.createElement('b'); b.textContent = s.display_name || '未命名会话';
      const sp = document.createElement('span'); sp.textContent = fmtTime(s.updated_at);
      nm.appendChild(b); nm.appendChild(sp);
      row.appendChild(av); row.appendChild(nm);
      row.onclick = () => openSession(s.session_id, s.display_name);
      box.appendChild(row);
    });
  }catch(e){
    box.innerHTML = '<div class="empty">加载失败：' + esc(e.message) + '</div>';
  }
}
function fmtTime(t){
  if (!t) return '';
  try{
    const d = new Date(t);
    const p = n => String(n).padStart(2, '0');
    return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }catch(e){ return ''; }
}
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

$('#btnNew').onclick = async () => {
  try{
    const j = await api('/api/v1/chat/sessions/new');
    const sid = (j.data || {}).session_id;
    if (!sid) throw new Error('没拿到会话 ID');
    openSession(sid, '新的会话');
  }catch(e){ toast('新建失败：' + e.message); }
};
$('#btnOut').onclick = () => {
  clearCfg();
  fetch(ORIGIN + '/__token', { method:'POST', body: '' });
  show('login');
};

/* ---------- 聊天 ---------- */
let curSid = '';
async function openSession(sid, title){
  curSid = sid;
  $('#chatTitle').textContent = title || '会话';
  $('#msgs').innerHTML = '<div class="empty">正在加载消息…</div>';
  show('chat');
  try{
    const j = await api('/api/v1/chat/sessions/' + sid);
    const hist = ((j.data || {}).history) || [];
    $('#msgs').innerHTML = hist.length ? '' : '<div class="empty">还没有消息，说点什么吧</div>';
    hist.forEach(m => renderHist(m));
    scrollBottom();
  }catch(e){
    $('#msgs').innerHTML = '<div class="empty">加载失败：' + esc(e.message) + '</div>';
  }
}
function renderHist(m){
  const c = m.content || {};
  const parts = c.message || [];
  const mine = (c.type === 'user');
  const bub = addRow(mine);
  parts.forEach(p => appendPart(bub, p));
}
function addRow(mine){
  if (document.querySelector('#msgs .empty')) $('#msgs').innerHTML = '';
  const row = document.createElement('div'); row.className = 'row' + (mine ? ' me' : '');
  const av = document.createElement('div'); av.className = 'av'; av.textContent = mine ? '我' : '🐱';
  const bub = document.createElement('div'); bub.className = 'bub';
  row.appendChild(av); row.appendChild(bub);
  $('#msgs').appendChild(row);
  return bub;
}
const HIDDEN_PART = ['think','tool_call','tool_result','reasoning','agent_stats','function_call','step'];
function cleanText(t){
  if (!t) return '';
  // 去掉混在正文里的工具调用 JSON
  const i = t.search(/\{\s*"id"\s*:\s*"call_/);
  return i >= 0 ? t.slice(0, i).trim() : t;
}
function appendPart(bub, p){
  const t = (p && (p.type || p.content_type)) || 'plain';
  if (HIDDEN_PART.indexOf(t) >= 0) return;
  if (t === 'plain' || t === 'text'){
    const txt = cleanText(p.text || '');
    if (txt) bub.appendChild(document.createTextNode(txt));
  }else if (t === 'image'){
    const img = document.createElement('img'); img.alt = '[图片]';
    bub.appendChild(img);
    const aid = p.attachment_id || p.attachmentId || p.id || '';
    if (aid) img.src = px(cfg.base + '/api/chat/get_attachment?attachment_id=' + encodeURIComponent(aid));
    else bub.appendChild(document.createTextNode('[图片]'));
  }else if (t === 'file' || t === 'record' || t === 'video'){
    const a = document.createElement('span');
    a.textContent = '📎 ' + (p.name || p.filename || '附件');
    bub.appendChild(a);
  }
}
function scrollBottom(){ const m = $('#msgs'); m.scrollTop = m.scrollHeight; }

$('#btnBack').onclick = () => { show('home'); loadSessions(); };

/* ---------- 待发送文件 ---------- */
let pendingFiles = [];
const chips = $('#chips');

function renderChips(){
  chips.innerHTML = '';
  if (!pendingFiles.length){ chips.classList.remove('on'); return; }
  chips.classList.add('on');
  pendingFiles.forEach((f, i) => {
    const c = document.createElement('div'); c.className = 'chip';
    c.appendChild(document.createTextNode((f.type === 'image' ? '🖼 ' : '📎 ') + (f.filename || '文件')));
    const x = document.createElement('span'); x.className = 'x'; x.textContent = '✕';
    x.onclick = () => { pendingFiles.splice(i, 1); renderChips(); };
    c.appendChild(x);
    chips.appendChild(c);
  });
}

$('#btnPlus').onclick = () => $('#fileSel').click();
$('#fileSel').onchange = async (e) => {
  const files = Array.from(e.target.files || []);
  e.target.value = '';
  for (const f of files){
    const isImg = f.type.startsWith('image/');
    const chip = { type: isImg ? 'image' : 'file', filename: f.name,
                   preview: isImg ? URL.createObjectURL(f) : '' };
    pendingFiles.push(chip);
    renderChips();
    try{
      const fd = new FormData();
      fd.append('file', f, f.name);
      const r = await fetch(px(cfg.base + '/api/v1/file'), {
        method: 'POST',
        headers: hdrs(),
        body: fd
      });
      const j = JSON.parse(await r.text() || '{}');
      const d = j.data || {};
      if (!d.attachment_id) throw new Error(j.message || '没有 attachment_id');
      chip.attachment_id = d.attachment_id;
      chip.type = d.type || chip.type;
      chip.filename = d.filename || chip.filename;
    }catch(err){
      toast('上传失败：' + err.message);
      const i = pendingFiles.indexOf(chip);
      if (i >= 0) pendingFiles.splice(i, 1);
    }
    renderChips();
  }
};

function buildMessageFor(text, list){
  const parts = [];
  if (text) parts.push({ type: 'plain', text });
  (list || []).forEach(f => {
    if (!f.attachment_id) return;
    parts.push({ type: f.type || 'file', attachment_id: f.attachment_id, filename: f.filename });
  });
  if (!parts.length) return text;
  if (parts.length === 1 && parts[0].type === 'plain') return text;
  return parts;
}

function cleanShow(t){
  if (!t) return '';
  return t.replace(/\[(IMAGE|FILE|RECORD|VIDEO|STICKER)\][^\s]*/gi, '')
          .replace(/<attachment[^>]*>/gi, '')
          .replace(/\n{3,}/g, '\n\n')
          .trim();
}
function isThought(t){
  if (!t) return false;
  if (t.length < 30) return false;
  const cn = (t.match(/[\u4e00-\u9fa5]/g) || []).length;
  return cn / t.length < 0.12;
}

let turnBubs = [];
function clearTurn(){
  turnBubs.forEach(b => { const r = b.closest ? b.closest('.row') : null; if (r) r.remove(); });
  turnBubs = [];
}
async function fetchTurnBots(){
  const j = await api('/api/v1/chat/sessions/' + curSid);
  const hist = ((j.data || {}).history) || [];
  let ui = -1;
  for (let i = hist.length - 1; i >= 0; i--){
    if (((hist[i].content || {}).type) === 'user'){ ui = i; break; }
  }
  return hist.slice(ui + 1).filter(m => ((m.content || {}).type) === 'bot');
}
/* 一轮回答可能分成好几条 bot 消息（图一条、字一条），而且落库有延迟，
   所以这里轮询几次，取到最多的那次重绘，保证图文都出来 */
async function syncTurn(tempBub){
  turnBubs = tempBub ? [tempBub] : [];
  let last = 0;
  for (let attempt = 0; attempt < 5; attempt++){
    if (attempt) await new Promise(r => setTimeout(r, attempt === 1 ? 400 : (attempt >= 4 ? 1500 : 900)));
    let bots;
    try{ bots = await fetchTurnBots(); }catch(e){ continue; }
    if (!bots.length) continue;
    if (attempt > 0 && bots.length <= last) continue;
    last = bots.length;
    clearTurn();
    bots.forEach(m => {
      const bub = addRow(false);
      turnBubs.push(bub);
      ((m.content || {}).message || []).forEach(p => appendPart(bub, p));
      if (!bub.textContent && !bub.querySelector('img')) bub.textContent = '（内容为空）';
    });
    scrollBottom();
  }
}

/* ---------- 发消息（流式） ---------- */
let sending = false;
async function send(){
  const ta = $('#input');
  const text = ta.value.trim();
  if ((!text && !pendingFiles.length) || sending) return;
  sending = true; $('#btnSend').disabled = true;
  ta.value = ''; ta.style.height = 'auto';

  const outgoing = pendingFiles.slice();
  const myBub = addRow(true);
  if (text) myBub.appendChild(document.createTextNode(text));
  outgoing.forEach(f => {
    if (f.type === 'image' && f.preview){
      const im = document.createElement('img');
      im.src = f.preview; im.style.maxWidth = '60%'; im.style.borderRadius = '10px';
      myBub.appendChild(im);
    }else{
      const tip = document.createElement('div');
      tip.textContent = '📎 ' + (f.filename || '文件');
      tip.style.color = '#5c7d64'; tip.style.fontSize = '13px';
      myBub.appendChild(tip);
    }
  });
  pendingFiles = []; renderChips();
  scrollBottom();
  const bub = addRow(false); bub.className = 'bub think'; bub.textContent = '…';
  let acc = '';
  try{
    const r = await fetch(px(cfg.base + '/api/v1/chat'), {
      method: 'POST',
      headers: hdrs({ 'Content-Type': 'application/json', 'Accept': 'text/event-stream' }),
      body: JSON.stringify({ message: buildMessageFor(text, outgoing), session_id: curSid, enable_streaming: true })
    });
    if (!r.ok || !r.body) throw new Error('HTTP ' + r.status);
    const reader = r.body.getReader();
    const dec = new TextDecoder('utf-8');
    let buf = '';
    let finished = false;
    while (!finished){
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf('\n')) >= 0){
        const line = buf.slice(0, idx).replace(/\r$/, '');
        buf = buf.slice(idx + 1);
        if (!line.startsWith('data:')) continue;
        const data = line.slice(5).trim();
        if (!data || data === '[DONE]') continue;
        let o;
        try{ o = JSON.parse(data); }catch(e){ continue; }
        if (o.type === 'plain' && typeof o.data === 'string'){
          acc += o.data;
          const cut = acc.search(/\{\s*"id"\s*:\s*"call_/);
          if (cut >= 0) acc = acc.slice(0, cut);
          if (isThought(acc)){ bub.textContent = '…'; continue; }
          const shown = cleanShow(acc);
          if (!shown){ bub.textContent = '（发来一张图…）'; continue; }
          bub.className = 'bub';
          bub.textContent = shown;
          scrollBottom();
        }else if (o.type === 'agent_stats'){
          if (isThought(acc)) acc = '';
          bub.textContent = cleanShow(acc) || '…';
        }else if (o.type === 'complete'){
          if (typeof o.data === 'string' && o.data.trim()){
            acc = o.data;
            bub.className = 'bub';
            bub.textContent = cleanShow(acc) || acc;
          }
          finished = true; break;
        }
      }
    }
    try{ reader.cancel(); }catch(e){}
    await syncTurn(bub);
    if (!acc && !bub.hasChildNodes() && !bub.textContent) bub.textContent = '（没有收到内容）';
  }catch(e){
    bub.className = 'bub';
    bub.textContent = '出错了：' + e.message;
  }finally{
    sending = false; $('#btnSend').disabled = false;
    scrollBottom();
  }
}
$('#btnSend').onclick = send;
$('#input').addEventListener('input', e => {
  const t = e.target; t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 120) + 'px';
});
$('#input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); send(); }
});

/* ---------- 返回键 ---------- */
let exitAt = 0;
window.__back = () => {
  if ($('#chat').classList.contains('on')){ show('home'); loadSessions(); return true; }
  if ($('#home').classList.contains('on')){
    const now = Date.now();
    if (now - exitAt < 1600){ if (window.AstrBot) window.AstrBot.exitApp(); return true; }
    exitAt = now;
    toast('再按一次退出');
    return true;
  }
  return false;
};
function toast(m){ if (window.AstrBot) { try{ window.AstrBot.toast(m); }catch(e){ alert(m); } } else alert(m); }

/* ---------- 启动 ---------- */
(function init(){
  $('#ver').textContent = VER + ' · 本机转发 ' + ORIGIN.replace('http://', '');
  if (loadCfg()){
    fetch(ORIGIN + '/__token', { method:'POST', body: cfg.token }).catch(() => {});
    bootHome();
  }else{
    show('login');
  }
})();
</script>
